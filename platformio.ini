[platformio]
default_envs = cloudsmoker2

; ---------------------------------------------------
; Shared Settings (Applies to all environments)
; ---------------------------------------------------
[env]
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
check_skip_packages = yes

lib_deps =
    https://github.com/tzapu/WiFiManager
    thomasfredericks/Bounce2@^2.70
    https://github.com/gfvalvo/NewEncoder
    yergin/YetAnotherButtonLibrary@^0.1.1
    robtillaart/ADS1X15@^0.3.5
    bodmer/TFT_eSPI @ ^2.5.31
    mathworks/ThingSpeak

; Shared Build Flags
build_flags =
; comment out the following line to enable debug output
;   -DWM_NODEBUG=1
    -I include

; ---------------------------------------------------
; Environment 1: Breadboard (ESP32 Firebeetle V4)
; ---------------------------------------------------
[env:breadboard]
platform = espressif32
board = firebeetle32
upload_port = /dev/ttyUSB*
monitor_port = /dev/ttyUSB*
monitor_speed = 115200
build_flags =
    ${env.build_flags}
    -D ENV_BREADBOARD
    -D USE_ADS1015
    -D PIN_I2C_SDA=21
    -D PIN_I2C_SCL=22
    -D PIN_ENC_CLK=5
    -D PIN_ENC_DT=2
    -D PIN_ENC_SW=0
    -D PIN_SPI_MOSI=23
    -D PIN_SPI_SCK=18
    -D PIN_DISP_CS=10
    -D PIN_DISP_DC=13
    -D PIN_BOOT_DISP_RST=27   ; breadboard: dedicated display reset, no shared boot function
    -D PIN_DISP_BL=9
    -D USER_SETUP_LOADED=1
    -D GC9A01_DRIVER=1
    -D TFT_MOSI=PIN_SPI_MOSI
    -D TFT_SCLK=PIN_SPI_SCK
    -D TFT_CS=PIN_DISP_CS
    -D TFT_DC=PIN_DISP_DC
    -D TFT_RST=PIN_BOOT_DISP_RST
    -D TFT_BL=PIN_DISP_BL
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D SPI_FREQUENCY=27000000

; ---------------------------------------------------
; Environment 2: cloudSmoker2 PCB (ESP32-C3)
; Pin assignments per V2 Microcontroller Pin Out wiki
; https://github.com/cwgstreet/cloudSmoker/wiki/V2-Micontroller-Pin-Out
; ---------------------------------------------------
[env:cloudsmoker2]
platform = espressif32
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -D ENV_PCB
    -D USE_ADS1115
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D PIN_I2C_SDA=0        ; I2C_SDA_3V3 (IO00)
    -D PIN_I2C_SCL=1        ; I2C_SCL_3V3 (IO01)
    -D PIN_ENC_DT=2         ; ENC_DT (IO02)
    -D PIN_ENC_CLK=3        ; ENC_CLK (IO03)
    -D PIN_DISP_DC=4        ; DISP_DC (IO04)
    -D PIN_DISP_BL=5        ; DISP_BL (IO05)
    -D PIN_SPI_SCK=6        ; SPI_SCK (IO06)
    -D PIN_SPI_MOSI=7       ; SPI_MOSI (IO07)
    -D PIN_DISP_CS=8        ; DISP_CS (IO08)
    -D PIN_BOOT_DISP_RST=9  ; ~BOOT_DISP_RST (IO09): shared strap/boot + display reset
    -D PIN_ENC_SW=10        ; ENC_SW (IO10)
    -D USER_SETUP_LOADED=1
    -D GC9A01_DRIVER=1
    -D TFT_MOSI=PIN_SPI_MOSI
    -D TFT_SCLK=PIN_SPI_SCK
    -D TFT_CS=PIN_DISP_CS
    -D TFT_DC=PIN_DISP_DC
    -D TFT_RST=PIN_BOOT_DISP_RST
    -D TFT_BL=PIN_DISP_BL
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D SPI_FREQUENCY=27000000

; ---------------------------------------------------
; Environment 3: Unit Testing (Native PC)
; ---------------------------------------------------
[env:native]
platform = native