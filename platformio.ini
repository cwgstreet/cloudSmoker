[platformio]
; Set the default environment to your current breadboard setup
default_envs = breadboard

; ---------------------------------------------------
; Shared Settings (Applies to all environments)
; ---------------------------------------------------
[env]
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
check_skip_packages = yes

lib_deps = 
    https://github.com/tzapu/WiFiManager
    thomasfredericks/Bounce2@^2.70
    https://github.com/gfvalvo/NewEncoder
    yergin/YetAnotherButtonLibrary@^0.1.1
    robtillaart/ADS1X15@^0.3.5
    bodmer/TFT_eSPI @ ^2.5.31

; Shared Build Flags
build_flags = 
    -DWM_NODEBUG=1 ; turn off debugging in WiFiManager

; ---------------------------------------------------
; Environment 1: Breadboard (ESP32 Firebeetle V4)
; ---------------------------------------------------
[env:breadboard]
platform = espressif32
board = firebeetle32
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
monitor_speed = 115200
build_flags =
    ${env.build_flags}
    -D ENV_BREADBOARD
    -D USE_ADS1015
    ; --- Breadboard Pin Definitions ---
    ; I2C Sensor
    -D PIN_I2C_SDA=21
    -D PIN_I2C_SCL=22
    ; EC11 Knob
    -D PIN_ENCODER_A=5       ; Updated from 27 to IO5 (Row 47 Left)
    -D PIN_ENCODER_B=2       ; Confirmed at IO2 (Row 48 Left)
    -D PIN_ENCODER_BTN=0     ; Confirmed at IO0 (Row 45 Right)
    ; Display (GC9A01)
    -D PIN_TFT_MOSI=23      ; Confirmed at IO23 (Row 47 Right)
    -D PIN_TFT_SCLK=18      ; Confirmed at IO18 (Row 46 Right)
    -D PIN_TFT_CS=10        ; Updated from 13 to IO10 (Row 45 Left)
    -D PIN_TFT_DC=13        ; Updated from 14 to IO13 (Row 46 Left)
    -D PIN_TFT_RST=27       ; Updated from 17 to IO27 (Row 43 Left)
    -D PIN_TFT_BLK=9        ; Updated from 16 to IO9 (Row 44 Left)
    ; TFT_eSPI setup flags (configures the library automatically)
    -D USER_SETUP_LOADED=1
    -D GC9A01_DRIVER=1
    -D TFT_MOSI=PIN_TFT_MOSI
    -D TFT_SCLK=PIN_TFT_SCLK
    -D TFT_CS=PIN_TFT_CS
    -D TFT_DC=PIN_TFT_DC
    -D TFT_RST=PIN_TFT_RST
    -D LOAD_GLCD=1
    -D SPI_FREQUENCY=27000000

    

; ---------------------------------------------------
; Environment 2: cloudSmoker2 PCB (ESP32-C3)
; ---------------------------------------------------
[env:cloudsmoker2]
platform = espressif32
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -D ENV_PCB
    -D USE_ADS1115
    -D ARDUINO_USB_MODE=1 
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; --- PCB Pin Definitions (from your Wiki) ---
    -D PIN_ENCODER_A=1
    -D PIN_ENCODER_B=2
    -D PIN_ENCODER_BTN=3
    -D PIN_I2C_SDA=5
    -D PIN_I2C_SCL=6
    -D PIN_BUZZER=7
    ; We will add the TFT flags here once the PCB display pinout is finalized

; ---------------------------------------------------
; Environment 3: Unit Testing (Native PC)
; ---------------------------------------------------
[env:native]
platform = native